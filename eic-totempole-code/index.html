<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teksystem Budapest — Lobby Kiosk</title>

    <!--
      Self-hosted fonts, preloaded. No CDN: the kiosk may sit on a restricted
      network, and a font request that fails is a visibly broken display
      (research.md R2). Drop the two .woff2 files into public/fonts/ — see
      public/fonts/README.md.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-v22-latin_latin-ext-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-v12-latin_latin-ext-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
